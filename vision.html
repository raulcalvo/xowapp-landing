<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https://pocketbase.raulcalvo.com https://dev.pocketbase.xowapp.com https://accounts.google.com/gsi/; img-src 'self' data: https://pocketbase.raulcalvo.com https://dev.pocketbase.xowapp.com https://*.googleusercontent.com; style-src 'self' https://fonts.googleapis.com https://accounts.google.com/gsi/style; font-src 'self' https://fonts.gstatic.com; script-src 'self' https://accounts.google.com/gsi/client; frame-src https://accounts.google.com/gsi/; frame-ancestors 'none'">
  <title id="pageTitle" data-i18n-key="vision_title">XowApp</title>
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/theme.css">
</head>
<body data-page="vision">
  <div class="xow-page">
    <div id="xow-nav-root"></div>

    <main class="xow-main">
      <div class="xow-container">

        <section class="xow-section xow-center">
          <div class="xow-kicker xow-center" id="vision_kicker"></div>
          <h1 class="xow-title" id="vision_title"></h1>
          <p class="xow-subtitle xow-lead" id="vision_intro"></p>
        </section>

        <section class="xow-section xow-card">
          <div class="xow-vision-block">
            <div class="xow-vision-icon"><svg class="icon"><use href="#i-photo_library"></use></svg></div>
            <div>
              <h3 id="vision_b1_title"></h3>
              <p id="vision_b1_body"></p>
            </div>
          </div>
          <div class="xow-vision-block">
            <div class="xow-vision-icon"><svg class="icon"><use href="#i-lock"></use></svg></div>
            <div>
              <h3 id="vision_b2_title"></h3>
              <p id="vision_b2_body"></p>
            </div>
          </div>
          <div class="xow-vision-block">
            <div class="xow-vision-icon"><svg class="icon"><use href="#i-shield"></use></svg></div>
            <div>
              <h3 id="vision_banon_title"></h3>
              <p id="vision_banon_body"></p>
            </div>
          </div>
          <div class="xow-vision-block">
            <div class="xow-vision-icon"><svg class="icon"><use href="#i-visibility_off"></use></svg></div>
            <div>
              <h3 id="vision_b3_title"></h3>
              <p id="vision_b3_body"></p>
            </div>
          </div>
          <div class="xow-vision-block">
            <div class="xow-vision-icon"><svg class="icon"><use href="#i-groups"></use></svg></div>
            <div>
              <h3 id="vision_b4_title"></h3>
              <p id="vision_b4_body"></p>
            </div>
          </div>
          <div class="xow-vision-block">
            <div class="xow-vision-icon"><svg class="icon"><use href="#i-check_circle"></use></svg></div>
            <div>
              <h3 id="vision_b5_title"></h3>
              <p id="vision_b5_body"></p>
            </div>
          </div>
        </section>

      </div>
    </main>

    <div id="xow-footer-root"></div>
  </div>

  <script src="assets/js/app-entry.js"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/icons.js"></script>
  <script src="assets/js/i18n-data.js"></script>
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/nav.js"></script>
  <script src="assets/js/donate-fab.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/user-menu.js"></script>
</body>
</html>
