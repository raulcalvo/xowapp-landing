<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https://pocketbase.raulcalvo.com; img-src 'self' data:; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self'; frame-ancestors 'none'">
  <title id="pageTitle" data-i18n-key="admin_title">XowApp Admin</title>
  <link rel="icon" type="image/png" href="../logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/theme.css">
</head>
<body data-page="admin">
  <div class="xow-page">
    <div class="xow-admin-shell">

      <div class="xow-card" id="adminLoginCard">
        <img class="xow-brand-logo" src="../logo.png" alt="XowApp" width="40" height="40">
        <h1 class="xow-title-sm" id="admin_title"></h1>
        <p class="xow-subtitle xow-lead" id="admin_subtitle"></p>

        <form id="adminLoginForm" novalidate>
          <div class="xow-form-group">
            <label for="adminEmail" id="admin_email_label"></label>
            <input type="email" id="adminEmail" name="email" autocomplete="username" required>
          </div>
          <div class="xow-form-group">
            <label for="adminPassword" id="admin_password_label"></label>
            <input type="password" id="adminPassword" name="password" autocomplete="current-password" required>
          </div>
          <p class="xow-form-error" id="adminLoginError" role="alert"></p>
          <button type="submit" class="btn btn-primary btn-block" id="admin_submit"></button>
        </form>
      </div>

      <div class="xow-card xow-admin-dashboard" id="adminDashboardCard" hidden>
        <div class="xow-avatar-placeholder" aria-hidden="true">XA</div>
        <h1 class="xow-title-sm" id="admin_dashboard_title"></h1>
        <p class="xow-subtitle xow-lead" id="adminWelcomeName"></p>
        <p class="xow-subtitle xow-lead" id="admin_dashboard_placeholder"></p>
        <button type="button" class="btn btn-secondary" id="adminLogoutBtn">
          <span id="admin_logout"></span>
        </button>
      </div>

    </div>
  </div>

  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/icons.js"></script>
  <script src="../assets/js/i18n-data.js"></script>
  <script src="../assets/js/i18n.js"></script>
  <script src="vendor/pocketbase.umd.js"></script>
  <script src="admin.js"></script>
</body>
</html>
