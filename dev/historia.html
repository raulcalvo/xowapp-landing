<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https://pocketbase.raulcalvo.com; img-src 'self' data:; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self'; frame-ancestors 'none'">
  <title id="pageTitle" data-i18n-key="historia_title">XowApp</title>
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/theme.css">
</head>
<body data-page="historia">
  <div class="xow-page">
    <div id="xow-nav-root"></div>

    <main class="xow-main">
      <div class="xow-container">

        <section class="xow-section xow-center">
          <div class="xow-kicker xow-center" id="historia_kicker"></div>
          <h1 class="xow-title" id="historia_title"></h1>
        </section>

        <section class="xow-section xow-article">
          <div class="xow-story-image-wrap">
            <img class="xow-story-image" src="assets/img/OurStory.jpg" data-i18n-key="historia_title" data-i18n-attr="alt" alt="Our Story" loading="eager">
          </div>
          <p id="historia_p1"></p>
          <p id="historia_p2"></p>
          <p id="historia_p3"></p>
          <p id="historia_p4"></p>
          <blockquote class="xow-pullquote" id="historia_pullquote"></blockquote>
          <p id="historia_p5"></p>
          <p id="historia_p6"></p>
          <p id="historia_p7"></p>
          <p id="historia_p8"></p>

          <div class="xow-teaser-actions">
            <a class="btn btn-primary" href="vision.html" id="historia_cta"></a>
          </div>
        </section>

      </div>
    </main>

    <div id="xow-footer-root"></div>
  </div>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/icons.js"></script>
  <script src="assets/js/i18n-data.js"></script>
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/nav.js"></script>
  <script src="assets/js/donate-fab.js"></script>
</body>
</html>
