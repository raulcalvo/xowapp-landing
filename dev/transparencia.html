<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https://pocketbase.raulcalvo.com https://accounts.google.com/gsi/; img-src 'self' data: https://pocketbase.raulcalvo.com https://*.googleusercontent.com; style-src 'self' https://fonts.googleapis.com https://accounts.google.com/gsi/style; font-src 'self' https://fonts.gstatic.com; script-src 'self' https://accounts.google.com/gsi/client; frame-src https://accounts.google.com/gsi/; frame-ancestors 'none'">
  <title id="pageTitle" data-i18n-key="transparencia_title">XowApp</title>
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/theme.css">
</head>
<body data-page="transparencia">
  <div class="xow-page">
    <div id="xow-nav-root"></div>

    <main class="xow-main">
      <div class="xow-container">

        <section class="xow-section xow-center">
          <div class="xow-kicker xow-center" id="transparencia_kicker"></div>
          <h1 class="xow-title" id="transparencia_title"></h1>
          <p class="xow-subtitle xow-lead" id="transparencia_intro"></p>
        </section>

        <section class="xow-section xow-card">
          <div class="xow-kicker" id="transparencia_phases_title"></div>

          <p id="fundingLoadingNotice" class="xow-funding-notice">
            <svg class="icon"><use href="#i-schedule"></use></svg>
            <span id="transparencia_status_loading"></span>
          </p>

          <p id="fundingMockNotice" class="xow-funding-notice" hidden>
            <svg class="icon"><use href="#i-visibility_off"></use></svg>
            <span id="transparencia_status_unavailable"></span>
          </p>

          <div id="fundingCards" hidden></div>

          <p class="xow-funding-notice" id="piiNoticeBox">
            <svg class="icon"><use href="#i-shield"></use></svg>
            <span id="transparencia_pii_notice"></span>
          </p>
        </section>

        <section class="xow-section xow-center">
          <a class="btn btn-primary" href="donar.html" id="transparencia_cta_donar" data-donate-cta></a>
        </section>

      </div>
    </main>

    <div id="xow-footer-root"></div>
  </div>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/icons.js"></script>
  <script src="assets/js/i18n-data.js"></script>
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/nav.js"></script>
  <script src="assets/js/donate-fab.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/user-menu.js"></script>
  <script src="assets/js/funding.js"></script>
  <script src="assets/js/transparencia.js"></script>
</body>
</html>
