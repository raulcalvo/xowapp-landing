  <script>
    (function () {
      function updateAnalogyVideos(lang) {
        var table = (window.XOW_I18N && window.XOW_I18N[lang]) ? window.XOW_I18N[lang] : {};
        document.querySelectorAll('[data-video-key]').forEach(function (container) {
          var videoSrc = (table[container.getAttribute('data-video-key')] || '').trim();
          var videoEl = container.querySelector('video');
          if (videoSrc) {
            if (videoEl.getAttribute('src') !== videoSrc) videoEl.src = videoSrc;
            container.hidden = false;
          } else {
            videoEl.removeAttribute('src');
            container.hidden = true;
          }
        });
      }
      document.addEventListener('DOMContentLoaded', function () {
        var lang = localStorage.getItem('xowapp_landing_lang') || 'es';
        updateAnalogyVideos(lang);
      });

      document.addEventListener('xow:langchange', function (e) {
        if (e.detail && e.detail.lang) {
          updateAnalogyVideos(e.detail.lang);
        }
      });
    })();
  </script>
