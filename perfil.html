<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https://pocketbase.raulcalvo.com https://dev.pocketbase.xowapp.com https://accounts.google.com/gsi/; img-src 'self' data: https://pocketbase.raulcalvo.com https://dev.pocketbase.xowapp.com https://*.googleusercontent.com; style-src 'self' https://fonts.googleapis.com https://accounts.google.com/gsi/style; font-src 'self' https://fonts.gstatic.com; script-src 'self' https://accounts.google.com/gsi/client; frame-src https://accounts.google.com/gsi/; frame-ancestors 'none'">
  <title id="pageTitle" data-i18n-key="profile_page_title">XowApp</title>
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/theme.css">
</head>
<body data-page="perfil">
  <div class="xow-page">
    <div id="xow-nav-root"></div>

    <main class="xow-main">
      <div class="xow-container">

        <section class="xow-section xow-card" id="profileCard" hidden>
          <div class="xow-profile-header">
            <div class="xow-profile-avatar-wrap" id="profileAvatarWrap"></div>
            <h1 class="xow-title-sm" id="profile_title"></h1>
          </div>

          <div class="xow-profile-field">
            <div class="xow-profile-field-label" id="profile_name_label"></div>
            <div class="xow-profile-field-value" id="profileNameValue"></div>
          </div>

          <div class="xow-profile-field">
            <div class="xow-profile-field-label" id="profile_email_label"></div>
            <div class="xow-profile-field-value-row">
              <span class="xow-profile-field-value" id="profileEmailValue"></span>
              <button type="button" class="xow-info-btn" id="profileEmailInfoBtn" aria-expanded="false" aria-describedby="profileEmailInfoBubble">
                <svg class="icon"><use href="#i-info"></use></svg>
                <span class="xow-tooltip-bubble" role="tooltip" id="profileEmailInfoBubble"></span>
              </button>
            </div>
          </div>

          <div class="xow-profile-field">
            <div class="xow-profile-field-label" id="profile_userid_label"></div>
            <div class="xow-profile-field-value is-mono" id="profileUserIdValue"></div>
          </div>

          <div class="xow-danger-zone">
            <div class="xow-danger-zone-title">
              <svg class="icon"><use href="#i-warning"></use></svg>
              <span id="profile_danger_zone_title"></span>
            </div>
            <p class="xow-danger-zone-desc" id="profile_danger_zone_desc"></p>
            <button class="btn btn-danger" type="button" id="profileDeleteBtn">
              <svg class="icon"><use href="#i-delete"></use></svg>
              <span id="profile_delete_button"></span>
            </button>
          </div>
        </section>

        <section class="xow-section xow-center">
          <a class="btn btn-secondary" href="index.html" id="profile_back_link"></a>
        </section>

      </div>
    </main>

    <div id="xow-footer-root"></div>
  </div>

  <div class="xow-modal-overlay" id="deleteModalOverlay" hidden>
    <div class="xow-modal" role="dialog" aria-modal="true" aria-labelledby="profile_delete_modal_title">
      <div class="xow-modal-title">
        <svg class="icon"><use href="#i-warning"></use></svg>
        <span id="profile_delete_modal_title"></span>
      </div>
      <p class="xow-modal-body" id="profile_delete_modal_body"></p>
      <label class="xow-modal-confirm-label" for="deleteConfirmInput" id="profile_delete_modal_confirm_label"></label>
      <input type="text" class="xow-modal-confirm-input" id="deleteConfirmInput" autocomplete="off" spellcheck="false"
        data-i18n-key="profile_delete_modal_confirm_placeholder" data-i18n-attr="placeholder" data-i18n-text="false">
      <p class="xow-modal-error" id="deleteModalError"></p>
      <div class="xow-modal-actions">
        <button class="btn btn-secondary" type="button" id="deleteModalCancelBtn"><span id="profile_delete_modal_cancel"></span></button>
        <button class="btn btn-danger" type="button" id="deleteModalConfirmBtn" disabled><span id="profile_delete_modal_confirm_button"></span></button>
      </div>
    </div>
  </div>

  <script src="assets/js/app-entry.js"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/icons.js"></script>
  <script src="assets/js/i18n-data.js"></script>
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/nav.js"></script>
  <script src="assets/js/donate-fab.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/user-menu.js"></script>
  <script src="assets/js/profile.js"></script>
</body>
</html>
